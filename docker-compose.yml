services:
  biographia_db:
    image: postgres:16-alpine
    container_name: biographia_db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-biographia}
      POSTGRES_USER: ${POSTGRES_USER:-biographia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-biographia}
    ports:
      - "127.0.0.1:5436:5432"
    volumes:
      - biographia_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-biographia} -d ${POSTGRES_DB:-biographia}"]
      interval: 5s
      timeout: 3s
      retries: 20

  biographia_minio:
    image: minio/minio:latest
    container_name: biographia_minio
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-biographia}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-biographia-minio}
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:5437:9000"
      - "127.0.0.1:5438:9001"
    volumes:
      - biographia_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      default:
        # boto3's endpoint URL validation rejects underscores in hostnames
        # (same class of issue as Django's Host-header check that forced
        # ssod-auth-internal into being - see biographia TZ section 13) -
        # "biographia_minio" itself can never work as MINIO_ENDPOINT_URL.
        aliases:
          - biographia-minio-internal

  biographia_app:
    build:
      context: .
    container_name: biographia_app
    restart: unless-stopped
    depends_on:
      biographia_db:
        condition: service_healthy
      biographia_minio:
        condition: service_healthy
    env_file:
      - .env
    environment:
      FLASK_APP: manage.py
    ports:
      # 0.0.0.0, not 127.0.0.1: unlike the other local services here, this
      # one also needs to be reachable from a phone on the same Wi-Fi
      # during biographia-mobile development (same reasoning as
      # biographia-mobile's Metro bundler already being LAN-exposed) -
      # not needed once the mobile app talks to a real deployed backend.
      - "0.0.0.0:5010:5000"
    volumes:
      - .:/app
    networks:
      - default
      - ssod_auth_net

  biographia_frontend:
    image: node:20-alpine
    container_name: biographia_frontend
    restart: unless-stopped
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    volumes:
      - ./frontend:/app
      - biographia_frontend_node_modules:/app/node_modules
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - biographia_app
    networks:
      - default

volumes:
  biographia_frontend_node_modules:
  biographia_postgres_data:
  biographia_minio_data:

networks:
  default: {}
  ssod_auth_net:
    external: true
